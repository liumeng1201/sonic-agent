name: maven compile test

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tags:
        description: '要构建的tag'
        required: true
        default: 'v2.7.4'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Validate and Compile with Maven
        run: mvn validate compile